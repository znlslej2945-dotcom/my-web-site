<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운행내역 관리</title>

    <!-- PDF 저장용 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --sub-text-color: #7b889b;
            --card-bg: #f8f9fa;
            --border-color: #e9ecef;
            --input-bg: #ffffff;
            --today-bg: #e05652;
            --today-text: #ffffff;
            --saturday-color: #4a90e2;
            --sunday-color: #d9534f;
            --hover-bg: #f0f3f7;
            --primary-color: #3182ce;
            --icon-color: #555555;
            --work-badge-bg: #3182ce;
            --work-badge-text: #ffffff;
            --off-badge-bg: #a0aec0;
            --off-badge-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --sub-text-color: #a0aec0;
            --card-bg: #1e1e1e;
            --border-color: #2d3748;
            --input-bg: #2d2d2d;
            --today-bg: #e05652;
            --today-text: #ffffff;
            --saturday-color: #63b3ed;
            --sunday-color: #fc8181;
            --hover-bg: #2a2a2a;
            --primary-color: #63b3ed;
            --icon-color: #cccccc;
            --work-badge-bg: #63b3ed;
            --work-badge-text: #121212;
            --off-badge-bg: #4a5568;
            --off-badge-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px 15px;
            margin: 0 auto;
            text-align: center;
            position: relative;
        }

        .top-btn-group {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 6px;
            z-index: 100;
            background-color: var(--bg-color);
            padding: 4px;
            border-radius: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--icon-color);
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .icon-btn:hover {
            color: var(--text-color);
            background-color: var(--hover-bg);
        }

        .icon-btn svg, .arrow-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .page {
            display: block;
            width: 100%;
        }

        .page.hidden {
            display: none !important;
        }

        .header {
            margin-top: 55px;
            margin-bottom: 25px;
        }

        #currentTime {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .date-navigator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        #currentDate {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--sub-text-color);
        }

        .arrow-btn {
            background: none;
            border: none;
            color: var(--sub-text-color);
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow-btn:hover {
            color: var(--text-color);
            background-color: var(--hover-bg);
        }

        .calendar-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            row-gap: 12px;
            column-gap: 0;
            align-items: center;
            justify-items: center;
            margin: 0 auto 25px auto;
        }

        .day-header {
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--sub-text-color);
            padding-bottom: 6px;
        }

        .date-cell {
            width: 46px;
            height: 46px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            margin: 0 auto;
        }

        .date-cell:hover:not(.empty) {
            background-color: var(--hover-bg);
        }

        .date-cell.sunday, .day-header.sunday {
            color: var(--sunday-color);
        }

        .date-cell.saturday, .day-header.saturday {
            color: var(--saturday-color);
        }

        .date-cell.today {
            background-color: var(--today-bg);
            color: var(--today-text) !important;
            font-weight: 700;
        }

        .work-badge {
            font-size: 0.6rem;
            background-color: var(--work-badge-bg);
            color: var(--work-badge-text);
            padding: 1px 4px;
            border-radius: 6px;
            margin-top: 1px;
            font-weight: 700;
            line-height: 1;
        }

        .off-badge {
            font-size: 0.6rem;
            background-color: var(--off-badge-bg);
            color: var(--off-badge-text);
            padding: 1px 4px;
            border-radius: 6px;
            margin-top: 1px;
            font-weight: 700;
            line-height: 1;
        }

        .summary-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            text-align: left;
            width: 100%;
        }

        .summary-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--sub-text-color);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .summary-row.total {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        .summary-value {
            font-weight: 700;
            white-space: nowrap;
        }

        /* 설정 화면 */
        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
            margin-bottom: 30px;
        }

        .settings-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .setting-section {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            text-align: left;
        }

        .setting-section h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--sub-text-color);
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .setting-item label {
            font-weight: 600;
            font-size: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-group label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--sub-text-color);
        }

        .input-box {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        .input-box:focus {
            border-color: var(--primary-color);
        }

        .price-setting {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .price-setting .input-box {
            width: 140px;
            text-align: right;
        }

        .theme-toggle-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            cursor: pointer;
            font-weight: 600;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .backup-btn-group {
            display: flex;
            gap: 10px;
        }

        .backup-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .backup-btn:hover {
            background-color: var(--hover-bg);
        }

        /* 운행 내역서 스타일 */
        .report-page {
            text-align: left;
            margin-top: 60px;
            width: 100%;
            padding-bottom: 20px;
            background-color: var(--bg-color);
            box-sizing: border-box;
        }

        .report-title {
            font-size: 1.4rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 18px;
        }

        .info-table, .report-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 0.82rem;
            table-layout: fixed;
        }

        .info-table th, .info-table td,
        .report-table th, .report-table td {
            border: 1px solid var(--border-color);
            padding: 6px 2px;
            color: var(--text-color);
            white-space: nowrap !important;
            word-break: keep-all !important;
        }

        .info-table th {
            background-color: var(--card-bg);
            color: var(--sub-text-color);
            font-weight: 700;
            width: 65px;
            text-align: center;
        }

        .report-table th {
            background-color: var(--card-bg);
            color: var(--sub-text-color);
            font-weight: 700;
            text-align: center;
        }

        .report-table td {
            text-align: center;
        }

        .report-table td.amount {
            text-align: right;
            padding-right: 4px;
        }

        .report-split-container {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .report-split-column {
            flex: 1;
            width: 50%;
        }

        .report-summary-box {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            margin-top: 15px;
        }

        /* PDF 저장 시 중앙 정렬 및 여백 제어용 스타일 */
        .pdf-export-mode {
            width: 100% !important;
            max-width: none !important;
            padding: 0 !important;
            margin: 0 auto !important;
            box-sizing: border-box !important;
        }

        .pdf-export-mode .report-page {
            margin-top: 0 !important;
            padding: 10px !important;
            background-color: #ffffff !important;
            color: #000000 !important;
        }

        .pdf-export-mode .report-title {
            color: #000000 !important;
        }

        .pdf-export-mode .info-table th,
        .pdf-export-mode .report-table th {
            background-color: #f2f2f2 !important;
            color: #000000 !important;
            border: 1px solid #cccccc !important;
        }

        .pdf-export-mode .info-table td,
        .pdf-export-mode .report-table td {
            color: #000000 !important;
            border: 1px solid #cccccc !important;
        }

        .pdf-export-mode .report-summary-box {
            background-color: #f9f9f9 !important;
            border: 1px solid #cccccc !important;
            color: #000000 !important;
        }

        /* 모달 및 토스트 알림 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.hidden {
            display: none !important;
        }

        .modal-content {
            background-color: var(--bg-color);
            border-radius: 16px;
            padding: 25px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .select-box {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 25px;
            outline: none;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn.confirm {
            background-color: var(--primary-color);
            color: #fff;
        }

        .modal-btn.cancel {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .toast-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 16px 28px;
            border-radius: 30px;
            font-size: 1.15rem;
            font-weight: 700;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-in-out;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
        }

        .toast-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container" id="appContent">

        <!-- [메인 페이지] -->
        <div id="mainPage" class="page">
            <div class="top-btn-group">
                <button class="icon-btn" onclick="showReport()" title="운행내역서">
                    <svg viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </button>
                <button class="icon-btn" onclick="showSettings('main')" title="설정">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>

            <div class="header">
                <div id="currentTime">--:--:--</div>
                <div class="date-navigator">
                    <button class="arrow-btn" onclick="changeMonth(-1)" title="이전 달">
                        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <div id="currentDate">----년 --월</div>
                    <button class="arrow-btn" onclick="changeMonth(1)" title="다음 달">
                        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
            </div>

            <div class="calendar-grid">
                <div class="day-header sunday">일</div>
                <div class="day-header">월</div>
                <div class="day-header">화</div>
                <div class="day-header">수</div>
                <div class="day-header">목</div>
                <div class="day-header">금</div>
                <div class="day-header saturday">토</div>

                <div id="calendar-cells" style="display: contents;"></div>
            </div>

            <div class="summary-card">
                <div class="summary-title">
                    <span>월간 운송료 정산</span>
                    <span id="summaryTotalWork">총 0회 근무</span>
                </div>
                <div class="summary-row">
                    <span>운송료</span>
                    <span class="summary-value" id="summaryFare">0 원</span>
                </div>
                <div class="summary-row">
                    <span>부가세 (10%)</span>
                    <span class="summary-value" id="summaryVat">0 원</span>
                </div>
                <div class="summary-row total">
                    <span>합계</span>
                    <span class="summary-value" id="summaryTotal">0 원</span>
                </div>
            </div>
        </div>

        <!-- [운행 내역서 페이지] -->
        <div id="reportPage" class="page hidden">
            <div class="top-btn-group">
                <!-- PDF 다운로드 버튼 -->
                <button class="icon-btn" onclick="downloadPDF()" title="PDF 다운로드">
                    <svg viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <path d="M12 18v-6"></path>
                        <path d="M9 15l3 3 3-3"></path>
                    </svg>
                </button>

                <!-- 설정 버튼 -->
                <button class="icon-btn" onclick="showSettings('report')" title="설정">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>

                <!-- 메인 화면 버튼 -->
                <button class="icon-btn" onclick="showMain()" title="메인 화면">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </button>
            </div>

            <!-- 파일 내보내기 대상 구역 -->
            <div class="report-page" id="reportContentToExport">
                <div class="report-title" id="reportMonthTitle">2026년 8월 운행내역서</div>

                <table class="info-table">
                    <tr>
                        <th>성명</th>
                        <td id="rptUserName">-</td>
                        <th>전화번호</th>
                        <td id="rptUserPhone">-</td>
                    </tr>
                    <tr>
                        <th>차량번호</th>
                        <td id="rptCarNumber">-</td>
                        <th>은행명</th>
                        <td id="rptBankName">-</td>
                    </tr>
                    <tr>
                        <th>계좌번호</th>
                        <td colspan="3" id="rptAccountNumber">-</td>
                    </tr>
                </table>

                <!-- 동적 표 영역 -->
                <div id="reportTableContainer"></div>

                <div class="report-summary-box">
                    <div class="summary-row">
                        <span>운송료 합계</span>
                        <span class="summary-value" id="rptFare">0 원</span>
                    </div>
                    <div class="summary-row">
                        <span>부가세 (10%)</span>
                        <span class="summary-value" id="rptVat">0 원</span>
                    </div>
                    <div class="summary-row total">
                        <span>총 청구 금액</span>
                        <span class="summary-value" id="rptTotal">0 원</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- [설정 페이지] -->
        <div id="settingsPage" class="page hidden">
            <div class="settings-header">
                <button class="icon-btn" onclick="goBackFromSettings()" title="뒤로가기">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <div class="settings-title">설정</div>
                <div style="width: 40px;"></div>
            </div>

            <div class="setting-section">
                <h3>테마 설정</h3>
                <div class="setting-item">
                    <label>테마 선택</label>
                    <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()">☀️ 라이트 모드</button>
                </div>
            </div>

            <div class="setting-section">
                <h3>데이터 백업 / 복구</h3>
                <p style="font-size: 0.85rem; color: var(--sub-text-color); margin-bottom: 12px;">
                    기기를 변경하거나 브라우저 초기화 시 근무 기록을 보관 및 원상복구할 수 있습니다.
                </p>
                <div class="backup-btn-group">
                    <button class="backup-btn" onclick="exportData()">
                        📤 백업 파일 저장
                    </button>
                    <button class="backup-btn" onclick="document.getElementById('importFileInput').click()">
                        📥 백업 파일 불러오기
                    </button>
                </div>
                <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importData(event)">
            </div>

            <div class="setting-section">
                <h3>단가 설정</h3>
                <div class="price-setting">
                    <label for="unitPrice">기본 단가 (원)</label>
                    <input type="number" id="unitPrice" class="input-box" placeholder="0">
                </div>
            </div>

            <div class="setting-section">
                <h3>근무횟수 설정</h3>
                <div class="price-setting">
                    <label for="maxWorkCount">일일 최대 근무 횟수</label>
                    <input type="number" id="maxWorkCount" class="input-box" value="2" min="1" max="50">
                </div>
            </div>

            <div class="setting-section">
                <h3>기본 정보 설정</h3>
                <div class="form-group">
                    <label for="userName">이름</label>
                    <input type="text" id="userName" class="input-box" placeholder="이름을 입력하세요">
                </div>
                <div class="form-group">
                    <label for="userPhone">전화번호</label>
                    <input type="tel" id="userPhone" class="input-box" placeholder="010-0000-0000">
                </div>
                <div class="form-group">
                    <label for="carNumber">차량번호</label>
                    <input type="text" id="carNumber" class="input-box" placeholder="12가 3456">
                </div>
                <div class="form-group">
                    <label for="bankName">은행명</label>
                    <input type="text" id="bankName" class="input-box" placeholder="예: 하나은행">
                </div>
                <div class="form-group">
                    <label for="accountNumber">계좌번호</label>
                    <input type="text" id="accountNumber" class="input-box" placeholder="계좌번호 입력">
                </div>
            </div>

            <button class="save-btn" onclick="saveSettings()">설정 저장하기</button>
        </div>

    </div>

    <!-- 근무 선택 모달 -->
    <div id="workModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div id="modalTitle" class="modal-title">근무 선택</div>
            <select id="workDropdown" class="select-box"></select>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModal()">취소</button>
                <button class="modal-btn confirm" onclick="confirmWorkRecord()">저장</button>
            </div>
        </div>
    </div>

    <div id="toastMessage" class="toast-message">👏 수고하셨습니다!</div>

    <script>
        let viewDate = new Date(); 
        let selectedDateKey = null; 
        let workData = JSON.parse(localStorage.getItem('workData')) || {}; 
        let previousPage = 'main'; 

        /* PDF 다운로드 */
        async function downloadPDF() {
            const container = document.getElementById('appContent');
            const element = document.getElementById('reportContentToExport');
            
            // 모바일 화면 한계를 넘어서 PDF 정렬을 바르게 맞추기 위한 전용 클래스 적용
            container.classList.add('pdf-export-mode');
            buildReportPage(true); // 저장용 2열 배치 적용

            const currentYear = viewDate.getFullYear();
            const currentMonth = viewDate.getMonth() + 1;
            
            const opt = {
                margin:       [12, 10, 12, 10], // 상, 좌, 하, 우 여백 (mm)
                filename:     `${currentYear}년_${currentMonth}월_운행내역서.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true, 
                    logging: false,
                    scrollX: 0,
                    scrollY: 0
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            try {
                await html2pdf().set(opt).from(element).save();
            } finally {
                // PDF 생성 종료 후 원래 스타일 상태로 복원
                container.classList.remove('pdf-export-mode');
                buildReportPage(false); 
            }
        }

        function hideAllPages() {
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('settingsPage').classList.add('hidden');
            document.getElementById('reportPage').classList.add('hidden');
        }

        function showMain() {
            hideAllPages();
            document.getElementById('mainPage').classList.remove('hidden');
        }

        function showSettings(fromPage) {
            if (fromPage) previousPage = fromPage;
            hideAllPages();
            document.getElementById('settingsPage').classList.remove('hidden');
        }

        function goBackFromSettings() {
            if (previousPage === 'report') {
                showReport();
            } else {
                showMain();
            }
        }

        function showReport() {
            hideAllPages();
            document.getElementById('reportPage').classList.remove('hidden');
            buildReportPage(false); 
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function setTheme(theme) {
            const btn = document.getElementById('themeToggleBtn');
            if (theme === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
                btn.textContent = '🌙 다크 모드';
            } else {
                document.body.removeAttribute('data-theme');
                btn.textContent = '☀️ 라이트 모드';
            }
        }

        function saveSettings() {
            const settings = {
                unitPrice: document.getElementById('unitPrice').value,
                maxWorkCount: document.getElementById('maxWorkCount').value || 2,
                userName: document.getElementById('userName').value,
                userPhone: document.getElementById('userPhone').value,
                carNumber: document.getElementById('carNumber').value,
                bankName: document.getElementById('bankName').value,
                accountNumber: document.getElementById('accountNumber').value
            };

            localStorage.setItem('userSettings', JSON.stringify(settings));
            alert('설정이 저장되었습니다.');
            goBackFromSettings();
            buildCalendar(); 
        }

        function loadSettings() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                setTheme(savedTheme);
            }

            const savedSettings = JSON.parse(localStorage.getItem('userSettings'));
            if (savedSettings) {
                document.getElementById('unitPrice').value = savedSettings.unitPrice || '';
                document.getElementById('maxWorkCount').value = savedSettings.maxWorkCount || '2';
                document.getElementById('userName').value = savedSettings.userName || '';
                document.getElementById('userPhone').value = savedSettings.userPhone || '';
                document.getElementById('carNumber').value = savedSettings.carNumber || '';
                document.getElementById('bankName').value = savedSettings.bankName || '';
                document.getElementById('accountNumber').value = savedSettings.accountNumber || '';
            }
        }

        function exportData() {
            const backupData = {
                userSettings: JSON.parse(localStorage.getItem('userSettings')) || {},
                workData: JSON.parse(localStorage.getItem('workData')) || {},
                theme: localStorage.getItem('theme') || 'light'
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
            const downloadAnchor = document.createElement('a');
            
            const todayStr = new Date().toISOString().slice(0, 10);
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `운행내역_백업_${todayStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.userSettings) localStorage.setItem('userSettings', JSON.stringify(imported.userSettings));
                    if (imported.workData) {
                        localStorage.setItem('workData', JSON.stringify(imported.workData));
                        workData = imported.workData;
                    }
                    if (imported.theme) localStorage.setItem('theme', imported.theme);

                    alert('백업 데이터가 성공적으로 복원되었습니다!');
                    loadSettings();
                    buildCalendar();
                } catch (err) {
                    alert('올바르지 않은 백업 파일입니다.');
                }
            };
            reader.readAsText(file);
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('currentTime').textContent = `${hours}:${minutes}:${seconds}`;
        }

        function changeMonth(delta) {
            viewDate.setMonth(viewDate.getMonth() + delta);
            buildCalendar();
        }

        function buildCalendar() {
            const cellsContainer = document.getElementById('calendar-cells');
            cellsContainer.innerHTML = '';

            const currentYear = viewDate.getFullYear();
            const currentMonth = viewDate.getMonth();
            const today = new Date();

            document.getElementById('currentDate').textContent = `${currentYear}년 ${currentMonth + 1}월`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('date-cell', 'empty');
                cellsContainer.appendChild(emptyCell);
            }

            let monthTotalWork = 0;

            for (let d = 1; d <= lastDate; d++) {
                const cell = document.createElement('div');
                cell.classList.add('date-cell');
                
                const dateText = document.createElement('span');
                dateText.textContent = d;
                cell.appendChild(dateText);

                const dayOfWeek = new Date(currentYear, currentMonth, d).getDay();
                if (dayOfWeek === 0) cell.classList.add('sunday');
                if (dayOfWeek === 6) cell.classList.add('saturday');

                if (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                    cell.classList.add('today');
                }

                const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const workVal = workData[dateKey];

                if (workVal === 'off') {
                    const badge = document.createElement('span');
                    badge.classList.add('off-badge');
                    badge.textContent = `휴무`;
                    cell.appendChild(badge);
                } else if (typeof workVal === 'number' && workVal > 0) {
                    monthTotalWork += workVal;

                    const badge = document.createElement('span');
                    badge.classList.add('work-badge');
                    badge.textContent = `${workVal}회`;
                    cell.appendChild(badge);
                }

                cell.addEventListener('click', () => openModal(dateKey, currentMonth + 1, d));
                cellsContainer.appendChild(cell);
            }

            updateSummary(monthTotalWork);
        }

        function updateSummary(totalCount) {
            const savedSettings = JSON.parse(localStorage.getItem('userSettings')) || {};
            const unitPrice = parseInt(savedSettings.unitPrice) || 0;

            const fare = totalCount * unitPrice;
            const vat = Math.round(fare * 0.1);
            const total = fare + vat;

            document.getElementById('summaryTotalWork').textContent = `총 ${totalCount}회 근무`;
            document.getElementById('summaryFare').textContent = `${fare.toLocaleString()} 원`;
            document.getElementById('summaryVat').textContent = `${vat.toLocaleString()} 원`;
            document.getElementById('summaryTotal').textContent = `${total.toLocaleString()} 원`;
        }

        function openModal(dateKey, month, day) {
            selectedDateKey = dateKey;
            document.getElementById('modalTitle').textContent = `${month}월 ${day}일 근무 선택`;

            const savedSettings = JSON.parse(localStorage.getItem('userSettings')) || {};
            const maxCount = parseInt(savedSettings.maxWorkCount) || 2;
            const currentWork = workData[dateKey];

            const dropdown = document.getElementById('workDropdown');
            dropdown.innerHTML = '';

            const cancelOpt = document.createElement('option');
            cancelOpt.value = "cancel";
            cancelOpt.textContent = "근무 취소 (기록 삭제)";
            dropdown.appendChild(cancelOpt);

            const offOpt = document.createElement('option');
            offOpt.value = "off";
            offOpt.textContent = "휴무";
            dropdown.appendChild(offOpt);

            for (let i = 1; i <= maxCount; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `${i}회 근무`;
                if (currentWork === i) {
                    option.selected = true;
                }
                dropdown.appendChild(option);
            }

            if (currentWork === 'off') {
                offOpt.selected = true;
            } else if (!currentWork) {
                cancelOpt.selected = true;
            }

            document.getElementById('workModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('workModal').classList.add('hidden');
        }

        function showToastMessage() {
            const toast = document.getElementById('toastMessage');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 900);
        }

        function confirmWorkRecord() {
            const dropdown = document.getElementById('workDropdown');
            const selectedVal = dropdown.value;

            if (selectedVal === "cancel") {
                delete workData[selectedDateKey];
            } else if (selectedVal === "off") {
                workData[selectedDateKey] = "off";
            } else {
                const count = parseInt(selectedVal);
                workData[selectedDateKey] = count;
                showToastMessage();
            }

            localStorage.setItem('workData', JSON.stringify(workData));
            closeModal();
            buildCalendar();
        }

        /* 단가 열이 삭제된 운행 내역 표 생성 함수 */
        function createTableHTML(items, unitPrice) {
            const headerHTML = `
                <table class="report-table">
                    <thead>
                        <tr>
                            <th style="width: 35%;">날짜</th>
                            <th style="width: 25%;">근무</th>
                            <th style="width: 40%;">금액</th>
                        </tr>
                    </thead>
                    <tbody>`;
            
            let bodyHTML = '';
            items.forEach(item => {
                const amount = item.workVal * unitPrice;
                bodyHTML += `
                    <tr>
                        <td>${item.day}일 (${item.dayOfWeekStr})</td>
                        <td>${item.workVal}회</td>
                        <td class="amount">${amount.toLocaleString()}원</td>
                    </tr>`;
            });

            const footerHTML = `</tbody></table>`;
            return headerHTML + bodyHTML + footerHTML;
        }

        function buildReportPage(isForExport = false) {
            const currentYear = viewDate.getFullYear();
            const currentMonth = viewDate.getMonth();
            const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();

            document.getElementById('reportMonthTitle').textContent = `${currentYear}년 ${currentMonth + 1}월 운행내역서`;

            const savedSettings = JSON.parse(localStorage.getItem('userSettings')) || {};
            document.getElementById('rptUserName').textContent = savedSettings.userName || '-';
            document.getElementById('rptUserPhone').textContent = savedSettings.userPhone || '-';
            document.getElementById('rptCarNumber').textContent = savedSettings.carNumber || '-';
            document.getElementById('rptBankName').textContent = savedSettings.bankName || '-';
            document.getElementById('rptAccountNumber').textContent = savedSettings.accountNumber || '-';

            const unitPrice = parseInt(savedSettings.unitPrice) || 0;
            const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];

            let workList = [];
            let totalMonthWork = 0;

            for (let d = 1; d <= lastDate; d++) {
                const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const workVal = workData[dateKey];

                if (typeof workVal === 'number' && workVal > 0) {
                    totalMonthWork += workVal;
                    const dayOfWeekStr = daysOfWeek[new Date(currentYear, currentMonth, d).getDay()];
                    workList.push({ day: d, dayOfWeekStr, workVal });
                }
            }

            const container = document.getElementById('reportTableContainer');
            container.innerHTML = '';

            if (workList.length === 0) {
                container.innerHTML = `
                    <table class="report-table">
                        <tbody>
                            <tr><td style="text-align:center; padding: 15px; color: var(--sub-text-color);">해당 월의 근무 내역이 없습니다.</td></tr>
                        </tbody>
                    </table>`;
            } else if (isForExport) {
                const half = Math.ceil(workList.length / 2);
                const leftList = workList.slice(0, half);
                const rightList = workList.slice(half);

                container.innerHTML = `
                    <div class="report-split-container">
                        <div class="report-split-column">${createTableHTML(leftList, unitPrice)}</div>
                        <div class="report-split-column">${rightList.length > 0 ? createTableHTML(rightList, unitPrice) : ''}</div>
                    </div>`;
            } else {
                container.innerHTML = createTableHTML(workList, unitPrice);
            }

            const totalFare = totalMonthWork * unitPrice;
            const totalVat = Math.round(totalFare * 0.1);
            const grandTotal = totalFare + totalVat;

            document.getElementById('rptFare').textContent = `${totalFare.toLocaleString()} 원`;
            document.getElementById('rptVat').textContent = `${totalVat.toLocaleString()} 원`;
            document.getElementById('rptTotal').textContent = `${grandTotal.toLocaleString()} 원`;
        }

        updateClock();
        setInterval(updateClock, 1000);
        loadSettings();
        buildCalendar();
    </script>
</body>
</html>
